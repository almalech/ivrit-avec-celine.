const KEY='ivrit-celine-v1';let store;try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){store={}};store.seen??={};store.missed??={};store.stats??={done:0,correct:0};store.levels??={};store.known??={};store.memoryCycle??=[];store.memoryCount??=0;let role=null,roleStep=0,roleErrors=0,roleHistory=[],roleLevel='hard',roleShowHints={},roleHints=0,roleNotice='';let memorySize=6;let tab='home',category='Tous',quiz=null,selected=null,checked=false,memory=null,memorySelected=null,memoryWrong=false,focus='À consolider',situation=null;const el=document.getElementById('app');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>[...a].sort(()=>Math.random()-.5);const pick=a=>a[Math.floor(Math.random()*a.length)];function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}function speak(t){if(!('speechSynthesis'in window))return alert('Voix hébraïque indisponible');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';u.rate=.8;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('he'));if(v)u.voice=v;speechSynthesis.speak(u)}function speakBtn(t){return `<button class="btn secondary" data-speak="${safe(t)}">🔊 Écouter</button>`}function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo({top:0,behavior:'smooth'})}function score(w){return (store.missed[w.id]||0)*3+(store.levels[w.id]||0)*-2+(w.cat==='Cahier · 8 leçons'?1:0)}function pool(){let a=WORDS.filter(w=>!store.known[w.id]&&(focus==='Tous'||(focus==='À consolider'?(score(w)>0||!store.seen[w.id]):w.cat===focus)));return a.length?a:WORDS.filter(w=>!store.known[w.id]).length?WORDS.filter(w=>!store.known[w.id]):WORDS}function weighted(){let a=pool();return pick(a.flatMap(w=>Array(Math.max(1,Math.min(7,3+score(w)))).fill(w)))}function home(){let learned=Object.keys(store.seen).length;return `<div class="card"><div class="eyebrow">Ton parcours personnalisé</div><div class="title">Parler avec confiance en Israël</div><p class="muted">${WORDS.length} mots et verbes disponibles · Les mots difficiles reviennent plus souvent.</p><div class="grid"><div class="stat"><b>${learned}/${WORDS.length}</b><span class="muted">Déjà étudiés</span></div><div class="stat"><b>${store.stats.done?Math.round(100*store.stats.correct/store.stats.done):0}%</b><span class="muted">Bonnes réponses</span></div></div><div class="actions"><button class="btn" data-go="quiz">M’entraîner</button><button class="btn secondary" data-go="memory">Jouer aux associations</button><button class="btn" data-go="roles">🎭 Jeux de rôle</button></div></div><div class="card"><div class="eyebrow">La vraie vie</div><div class="title">Choisis une situation</div><div class="grid">${SITUATIONS.map((s,i)=>`<button class="choice" data-situation="${i}">${safe(s.name)}</button>`).join('')}</div></div>`}function situations(){if(situation===null)return `<div class="card"><div class="eyebrow">Hébreu de la vraie vie</div><div class="title">Où veux-tu t’entraîner ?</div><p class="muted">Chaque situation propose une phrase utile et les verbes associés.</p>${SITUATIONS.map((s,i)=>`<button class="choice" data-situation="${i}"><b>${safe(s.name)}</b><div class="muted">${safe(s.intro)}</div></button>`).join('')}</div>`;let s=SITUATIONS[situation],arr=WORDS.filter(w=>w.cat===s.cat);return `<div class="card"><button class="btn ghost" data-back="1">← Toutes les situations</button><div class="title">${safe(s.name)}</div><p class="muted">${safe(s.intro)}</p><div class="he">${safe(s.he)}</div><div class="phon">${safe(s.ph)}</div><p>${safe(s.fr)}</p>${speakBtn(s.he)}<div class="actions"><button class="btn" data-situation-quiz="${safe(s.cat)}">M’entraîner sur ce thème</button></div></div><div class="card"><div class="title">Vocabulaire utile</div>${arr.map(wordHtml).join('')||'<p>Autres mots à venir.</p>'}</div>`}function wordHtml(w){return `<div class="word"><div class="he">${safe(w.he)}</div><div class="phon">${safe(w.ph)}</div><b>${safe(w.fr)}</b>${w.female?`<p class="muted">Présent : ♀ <b dir="rtl">${safe(w.female)}</b> · ♂ <b dir="rtl">${safe(w.male)}</b>${w.past?`<br>Passé (je) : <b dir="rtl">${safe(w.past)}</b>`:''}</p>`:''}${w.example?`<div dir="rtl" style="text-align:right">${safe(w.example)}</div><div class="muted">${safe(w.ef)}</div>`:''}<div class="actions">${speakBtn(w.he)}<button class="btn ghost" data-learn="${safe(w.id)}">${store.seen[w.id]?'✓ Étudié':'Marquer étudié'}</button><button class="btn ghost" data-known="${safe(w.id)}">${store.known[w.id]?'✓ Je connais déjà':'Je connais déjà'}</button></div></div>`}function words(){let cats=['Tous',...new Set(WORDS.map(w=>w.cat))];let a=WORDS.filter(w=>category==='Tous'||w.cat===category);return `<div class="card"><div class="eyebrow">Lexique</div><div class="title">Mes mots utiles (${a.length})</div><label>Catégorie</label><select id="category">${cats.map(c=>`<option ${category===c?'selected':''}>${safe(c)}</option>`).join('')}</select>${a.map(wordHtml).join('')}</div>`}function startQuiz(){let w=weighted(),reverse=Math.random()<.5,others=shuffle(WORDS.filter(x=>x.id!==w.id&&x.fr!==w.fr)).slice(0,3);let opts=shuffle([w,...others]);quiz={w,reverse,opts,correct:opts.findIndex(x=>x.id===w.id)};selected=null;checked=false;setTab('quiz')}function quizView(){if(!quiz)return `<div class="card"><div class="eyebrow">Entraînement intelligent</div><div class="title">Traduire dans les deux sens</div><p class="muted">Les questions alternent entre hébreu → français et français → hébreu. Les erreurs reviennent plus souvent.</p><label>Je veux réviser</label><select id="focus"><option>À consolider</option><option>Tous</option>${[...new Set(WORDS.map(w=>w.cat))].map(c=>`<option>${safe(c)}</option>`).join('')}</select><div class="actions"><button class="btn" data-start="1">Commencer</button></div></div>`;let q=quiz;return `<div class="card"><div class="eyebrow">${q.reverse?'FRANÇAIS → HÉBREU':'HÉBREU → FRANÇAIS'}</div><div class="title">${q.reverse?'Comment dit-on en hébreu ?':'Que signifie ce mot ?'}</div>${q.reverse?`<h2>${safe(q.w.fr)}</h2>`:`<div class="he">${safe(q.w.he)}</div><div class="phon">${safe(q.w.ph)}</div>${speakBtn(q.w.he)}`}${q.opts.map((w,i)=>`<button class="choice ${selected===i?'selected':''}" data-choice="${i}" ${checked?'disabled':''}>${q.reverse?`<span dir="rtl" style="font-size:23px">${safe(w.he)}</span>`:safe(w.fr)}</button>`).join('')}${checked?`<div class="feedback ${selected===q.correct?'':'bad'}"><b>${selected===q.correct?'Bravo ! 🌸':'À revoir'}</b><div>Bonne réponse : <b>${safe(q.w.he)}</b> — ${safe(q.w.fr)}</div><div class="phon">${safe(q.w.ph)}</div>${q.w.female?`Présent féminin : <b>${safe(q.w.female)}</b>`:''}</div><div class="actions"><button class="btn" data-next="1">Question suivante</button></div>`:`<div class="actions"><button class="btn" data-check="1" ${selected===null?'disabled':''}>Vérifier</button></div>`}</div>`}function startMemory(){let all=WORDS.filter(w=>!store.known[w.id]);if(!all.length)all=WORDS;let ids=all.map(w=>w.id);store.memoryCycle=store.memoryCycle.filter(id=>ids.includes(id));let remaining=all.filter(w=>!store.memoryCycle.includes(w.id));if(remaining.length<Math.min(memorySize,all.length)){store.memoryCycle=[];remaining=all}let a=shuffle(remaining).slice(0,Math.min(memorySize,remaining.length));store.memoryCycle.push(...a.map(w=>w.id));store.memoryCount=store.memoryCycle.length;save();memory={items:a,order:shuffle(a),matched:[],attempts:0};memorySelected=null;memoryWrong=false;setTab('memory')}function memoryView(){if(!memory)return `<div class="card"><div class="eyebrow">Jeu d’associations</div><div class="title">Relie les verbes 🎯</div><p class="muted">Des séries différentes jusqu’à avoir parcouru tous les mots. Les erreurs seront ajoutées à tes révisions.</p><label>Paires par partie</label><select id="memory-size"><option value="5" ${memorySize===5?'selected':''}>5 paires</option><option value="6" ${memorySize===6?'selected':''}>6 paires</option></select><p class="muted">Cycle : ${store.memoryCycle.length} / ${WORDS.filter(w=>!store.known[w.id]).length} mots parcourus</p><button class="btn" data-memory-start="1">Jouer</button></div>`;let m=memory,done=m.matched.length;return `<div class="card"><div class="eyebrow">Memory des verbes</div><div class="title">${done===m.items.length?'Bravo, partie terminée ! 🌸':'Associe les deux colonnes'}</div><p class="muted">${done}/${m.items.length} paires · ${m.attempts} essais · Cycle : ${store.memoryCycle.length}/${WORDS.filter(w=>!store.known[w.id]).length}</p><div class="progress"><div style="width:${100*done/m.items.length}%"></div></div><p class="muted">Appuie sur un verbe en hébreu, puis sur sa traduction.</p><div class="memorycols"><div class="memorylist">${m.items.map(w=>`<button class="matchbtn hebrew ${m.matched.includes(w.id)?'done':memorySelected===w.id?'chosen':''}" data-memory-he="${safe(w.id)}" ${m.matched.includes(w.id)?'disabled':''}>${safe(w.he)}</button>`).join('')}</div><div class="memorylist">${m.order.map(w=>`<button class="matchbtn ${m.matched.includes(w.id)?'done':''}" data-memory-fr="${safe(w.id)}" ${m.matched.includes(w.id)?'disabled':''}>${safe(w.fr)}</button>`).join('')}</div></div>${memoryWrong?'<p style="color:#A54651">Essaie encore !</p>':''}${done===m.items.length?'<div class="feedback">Partie réussie !</div>':''}<div class="actions"><button class="btn" data-memory-start="1">${done===m.items.length?'Nouvelle partie':'Recommencer'}</button></div></div>`}function review(){let a=WORDS.filter(w=>(store.missed[w.id]||0)>0).sort((x,y)=>(store.missed[y.id]||0)-(store.missed[x.id]||0));return `<div class="card"><div class="eyebrow">Révision personnalisée</div><div class="title">Mes verbes difficiles</div><p class="muted">Les mots ratés sont prioritaires. Un mot réussi plusieurs fois devient moins fréquent.</p>${a.length?a.map(w=>`<div class="word"><b dir="rtl">${safe(w.he)}</b> — ${safe(w.fr)} <span class="pill">${store.missed[w.id]} erreur(s)</span></div>`).join(''):'<div class="notice">Aucune erreur enregistrée pour le moment.</div>'}<button class="btn" data-review="1">Réviser maintenant</button></div>`}function progress(){return `<div class="card"><div class="eyebrow">Tes progrès</div><div class="title">Tu avances à ton rythme</div><div class="grid"><div class="stat"><b>${store.stats.done}</b>Questions</div><div class="stat"><b>${store.stats.done?Math.round(100*store.stats.correct/store.stats.done):0}%</b>Réussite</div><div class="stat"><b>${Object.keys(store.seen).length}</b>Mots étudiés</div><div class="stat"><b>${WORDS.filter(w=>store.missed[w.id]>0).length}</b>À revoir</div></div><p class="muted">Les résultats restent dans ce navigateur sur cet appareil.</p><div class="actions"><button class="btn secondary" data-export="1">Sauvegarder mes progrès</button><label style="margin:0"><span class="btn ghost" style="display:inline-block">Restaurer une sauvegarde</span><input type="file" id="restore" accept="application/json" style="display:none"></label></div></div>`}function rolesView(){if(role===null)return `<div class="card"><div class="eyebrow">Mode aventure 🎭 · Immersion</div><div class="title">20 échanges par aventure</div><p class="muted">Toutes les phrases et toutes les réponses sont en hébreu. Appuie sur 💡 seulement si tu as besoin d’une traduction. Tes choix ont des conséquences.</p>${MISSIONS.map((m,i)=>`<button class="choice" data-role="${i}"><b>${safe(m.name)}</b><div class="muted">${safe(m.intro)} · ${m.steps.length} échanges</div></button>`).join('')}</div>`;let m=MISSIONS[role],end=roleStep<0||roleStep>=m.steps.length;if(end)return `<div class="card"><div class="eyebrow">${safe(m.name)}</div><div class="title">${roleStep<0?'Mission interrompue':'🌸 Mission terminée !'}</div><p class="muted">${roleHistory.length} échanges · ${roleErrors} réponse(s) à revoir · ${roleHints} aide(s) consultée(s)< function render(){el.innerHTML=tab==='roles'?rolesView():tab==='home'?home():tab==='situations'?situations():tab==='words'?words():tab==='quiz'?quizView():tab==='memory'?memoryView():tab==='review'?review():progress()}function record(w,good){store.stats.done++;if(good)store.stats.correct++;store.seen[w.id]=true;store.missed[w.id]=Math.max(0,(store.missed[w.id]||0)+(good?-1:1));store.levels[w.id]=Math.max(0,(store.levels[w.id]||0)+(good?1:-2));save()}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.tab){setTab(d.tab);return}if(d.go){setTab(d.go);return}if(d.speak){speak(d.speak);return}if(d.learn){store.seen[d.learn]=true;save();render();return}if(d.known){store.known[d.known]=!store.known[d.known];store.seen[d.known]=true;save();render();return}if(d.role!==undefined){role=Number(d.role);roleStep=0;roleErrors=0;roleHistory=[];roleShowHints={};roleHints=0;roleNotice='';setTab('roles');return}if(d.roleBack){role=null;roleShowHints={};render();return}if(d.roleHint!==undefined){if(!roleShowHints[d.roleHint])roleHints++;roleShowHints[d.roleHint]=!roleShowHints[d.roleHint];render();return}if(d.roleAnswer!==undefined){let q=MISSIONS[role].steps[roleStep],opt=q.opts[Number(d.roleAnswer)];roleHistory.push({he:q.he,questionFr:q.fr,choice:opt[0],meaning:opt[1],score:opt[2]});if(opt[2]===-1){roleErrors++;roleNotice='Cette réponse ne convient pas à la situation. Tu peux réessayer.';roleShowHints={};render();return}else if(opt[2]===0){roleErrors++;roleNotice='Réponse possible, mais essaie de répondre plus directement.'}else roleNotice='';roleStep++;roleShowHints={};render();return}if(d.roleRetry){roleStep=0;roleErrors=0;roleHistory=[];roleShowHints={};roleHints=0;roleNotice='';render();return}if(d.situation!==undefined){situation=Number(d.situation);setTab('situations');return}if(d.back){situation=null;render();return}if(d.situationQuiz){focus=d.situationQuiz;startQuiz();return}if(d.start){startQuiz();return}if(d.choice!==und
