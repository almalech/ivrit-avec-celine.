<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8B6875"><title>Ivrit avec Céline</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#493B40;background:#F8F3F0}*{box-sizing:border-box}body{margin:0}header{background:#8B6875;color:white;padding:24px 18px 22px;border-radius:0 0 26px 26px}header h1{margin:0;font-size:25px}header p{margin:7px 0 0;color:#F9E8ED;font-size:14px}.wrap{max-width:650px;margin:auto;padding:0 16px 40px}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0 20px;padding-bottom:4px}.tabs button{white-space:nowrap;background:white;border:1px solid #E8DBD9;color:#6D5360;padding:10px 14px;border-radius:13px;font-weight:650}.tabs button.active{background:#EBCDD4;border-color:#CDA6B0}.card{background:white;border:1px solid #E9DDDB;border-radius:20px;padding:19px;margin-bottom:14px;box-shadow:0 3px 12px #8B687510}.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#98767E;font-weight:750}.title{font-size:22px;font-weight:760;margin:7px 0}.muted{color:#786B70;font-size:14px}.he{direction:rtl;text-align:right;font-size:29px;font-weight:700;line-height:1.55}.phon{font-size:15px;color:#98767E;font-style:italic}.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:750;font-size:15px;background:#8B6875;color:white;cursor:pointer}.btn.secondary{background:#F3E4E8;color:#755461}.btn.ghost{background:white;color:#8B6875;border:1px solid #E8DBD9}.btn:disabled{opacity:.45}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#F3E8E4;padding:14px;border-radius:14px}.stat b{display:block;font-size:25px}.choice{display:block;width:100%;text-align:left;padding:13px 14px;margin:9px 0;background:#FFFCFB;border:1px solid #E7D9D7;border-radius:12px;color:#493B40;font-size:16px}.choice.selected{border:2px solid #B98D99;background:#F8E9ED}.choice.wrong{border:2px solid #bb6a65;background:#fff0ee}.feedback{background:#F6E9ED;border-radius:13px;padding:13px;margin-top:12px;line-height:1.6}.feedback.bad{background:#fff1ec}input[type=text]{font-size:19px;width:100%;padding:14px;border-radius:12px;border:1px solid #D4BEC5;margin-top:10px}.small{font-size:12px}.progress{height:9px;background:#E9DADD;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#B98D99;transition:width .2s}.word{border-bottom:1px solid #E9DDDB;padding:13px 0}.word:last-child{border:0}.word strong{font-size:23px}.pill{display:inline-block;background:#F1DEE4;color:#8B6875;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:700}.notice{background:#fff7e7;padding:12px;border-radius:13px;color:#75582e;font-size:13px}footer{color:#8D7C80;text-align:center;font-size:12px;padding:12px}.hidden{display:none}@media(max-width:380px){.grid{grid-template-columns:1fr}.he{font-size:26px}}
</style></head><body><header><div style="max-width:650px;margin:auto"><div style="font-size:13px;color:#F7E4EA;font-weight:700">APPRENDRE L'HÉBREU DE LA VRAIE VIE</div><h1>Ivrit avec Céline 🌸</h1><p>Un peu d’hébreu, beaucoup de progrès.</p></div></header><div class="wrap"><nav class="tabs" id="tabs"><button data-tab="home" class="active">Accueil</button><button data-tab="words">Vocabulaire</button><button data-tab="quiz">Exercices</button><button data-tab="review">Révisions</button><button data-tab="progress">Progrès</button></nav><main id="app"><div class="card"><div class="eyebrow">MA LEÇON DU JOUR</div><h2 class="title">À la mairie</h2><p class="muted">Documents, attestations et remboursements.</p><p class="muted">Chargement des exercices…</p></div></main><footer>Version 2 · Les progrès sont enregistrés dans ce navigateur sur cet appareil.</footer></div><script>
const WORDS=[
{id:'tofess',he:'טופס',ph:'tofess',fr:'formulaire',cat:'Démarches',example:'אני צריכה למלא טופס',ep:'Ani tsrikha lemale tofess',ef:'Je dois remplir un formulaire'},
{id:'mismakh',he:'מסמך',ph:'mismakh',fr:'document',cat:'Démarches',example:'חסר לי מסמך',ep:'Khasser li mismakh',ef:'Il me manque un document'},
{id:'ishur',he:'אישור',ph:'ichour',fr:'attestation / autorisation',cat:'Démarches',example:'אני צריכה אישור',ep:'Ani tsrikha ichour',ef:"J'ai besoin d'une attestation"},
{id:'hekhzer',he:'החזר כספי',ph:'hekhzer kaspi',fr:'remboursement',cat:'Démarches',example:'אני מבקשת החזר כספי',ep:'Ani mevakeshet hekhzer kaspi',ef:'Je demande un remboursement'},
{id:'agra',he:'אגרה',ph:'agra',fr:'frais administratifs',cat:'Démarches',example:'כמה עולה האגרה?',ep:'Kama ola ha-agra?',ef:'Combien coûtent les frais administratifs ?'},
{id:'baalut',he:'בעלות',ph:'baalout',fr:'propriété',cat:'Démarches',example:'אני רוצה להעביר בעלות',ep:'Ani rotsa lehaavir baalout',ef:'Je veux transférer la propriété'},
{id:'lemale',he:'למלא',ph:'lemalé',fr:'remplir (un formulaire)',cat:'Démarches',example:'איפה צריך למלא?',ep:'Eifo tsarikh lemale?',ef:'Où faut-il remplir ?'},
{id:'lehatim',he:'לחתום',ph:'lakhtom',fr:'signer',cat:'Démarches',example:'איפה אני צריכה לחתום?',ep:'Eifo ani tsrikha lakhtom?',ef:'Où dois-je signer ?'},
{id:'levare',he:'לברר',ph:'levarèr',fr:'se renseigner / vérifier',cat:'Verbes à revoir',example:'אני רוצה לברר מה המחיר',ep:'Ani rotsa levarer ma hamekhir',ef:'Je veux me renseigner sur le prix'},
{id:'levater',he:'לוותר',ph:'levatèr',fr:'renoncer',cat:'Verbes à revoir',example:'אני לא רוצה לוותר',ep:'Ani lo rotsa levater',ef:'Je ne veux pas renoncer'},
{id:'lehitakhzev',he:'להתאכזב',ph:'lehitakhzèv',fr:'être déçu',cat:'Verbes à revoir',example:'אני לא רוצה להתאכזב',ep:'Ani lo rotsa lehitakhzev',ef:'Je ne veux pas être déçue'},
{id:'lehitakev',he:'להתעכב',ph:'lehitakèv',fr:'être retardé / prendre du retard',cat:'Verbes à revoir',example:'אני מתעכבת קצת',ep:'Ani mitakevet ktsat',ef:'Je prends un peu de retard'},
{id:'leakev',he:'לעכב',ph:'leakèv',fr:'retarder quelqu’un',cat:'Verbes à revoir',example:'אני לא רוצה לעכב אותך',ep:'Ani lo rotsa leakev otkha',ef:'Je ne veux pas te retarder'},
{id:'leshakhnea',he:'לשכנע',ph:'leshakhnéa',fr:'convaincre',cat:'Verbes à revoir',example:'היא שכנעה אותי',ep:'Hi shikhnea oti',ef:"Elle m'a convaincue"},
{id:'lehazmin',he:'להזמין',ph:'lehazmin',fr:'commander / réserver / inviter',cat:'Vie quotidienne',example:'אני רוצה להזמין תור',ep:'Ani rotsa lehazmin tor',ef:'Je veux prendre rendez-vous'},
{id:'lehamlits',he:'להמליץ',ph:'lehamlits',fr:'recommander',cat:'Vie quotidienne',example:'אני ממליצה על הטיפול הזה',ep:'Ani mamlitsa al hatipoul haze',ef:'Je recommande ce soin'},
{id:'lehodia',he:'להודיע',ph:'lehodia',fr:'prévenir / informer',cat:'Vie quotidienne',example:'אני מודיעה למורה',ep:'Ani modia lamora',ef:'Je préviens la maîtresse'},
{id:'lehatsliah',he:'להצליח',ph:'lehatsliah',fr:'réussir',cat:'Vie quotidienne',example:'אני מצליחה לדבר בעברית',ep:'Ani matslikha ledaber beivrit',ef:'Je réussis à parler hébreu'}
];
const SCENARIOS=[{name:'À la mairie',description:'On te demande un document.',he:'חסר לך מסמך. את צריכה למלא טופס ולחתום כאן.',ph:'Khasser lakh mismakh. At tsrikha lemale tofess velakhtom kan.',question:'Que dois-tu faire ?',options:['Payer une amende','Remplir un formulaire et signer','Annuler un rendez-vous'],answer:1,explain:'חסר לך מסמך = il te manque un document ; למלא טופס = remplir un formulaire ; לחתום = signer.'},{name:'Remboursement',description:'Tu demandes un remboursement.',he:'אני רוצה לבקש החזר כספי על האגרה ששילמתי.',ph:'Ani rotsa levakesh hekhzer kaspi al ha-agra sheshilamti.',question:'Que demandes-tu ?',options:['Un nouveau formulaire','Un remboursement des frais payés','Un rendez-vous'],answer:1,explain:'החזר כספי = remboursement ; אגרה = frais administratifs ; שילמתי = j’ai payé.'},{name:'Retard au rendez-vous',description:'Une personne t’envoie un message.',he:'אני מתעכבת בעשר דקות. סליחה!',ph:'Ani mitakevet be-eser dakot. Slikha!',question:'Que veut-elle dire ?',options:['Elle annule le rendez-vous','Elle arrive avec dix minutes de retard','Elle te demande de patienter une heure'],answer:1,explain:'מתעכבת = je suis retardée ; בעשר דקות = de dix minutes.'}];
let store;try{store=JSON.parse(localStorage.getItem('ivrit-celine-v1')||'{}')}catch(e){store={}};store.seen??={};store.stats??={done:0,correct:0};store.missed??={};let tab='home',quiz=null,selected=null,showAnswer=false,wordCategory='Tous';const el=document.getElementById('app');const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('ivrit-celine-v1',JSON.stringify(store))}catch(e){}}function speak(t){if(!('speechSynthesis'in window)){alert('La synthèse vocale n’est pas disponible sur cet appareil.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='he-IL';u.rate=.78;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('he'));if(v)u.voice=v;speechSynthesis.speak(u)}function btnSpeak(t){return `<button class="btn secondary" data-speak="${safe(t)}">🔊 Écouter</button>`}function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo({top:0,behavior:'smooth'})}function home(){let done=Object.keys(store.seen).length;return `<div class="card"><div class="eyebrow">Ton parcours personnalisé</div><div class="title">Parler avec confiance en Israël</div><p class="muted">Aujourd'hui : démarches, formulaires, remboursement et verbes à consolider.</p><div class="grid"><div class="stat"><b>${done}/${WORDS.length}</b><span class="muted">Mots déjà étudiés</span></div><div class="stat"><b>${store.stats.done?Math.round(100*store.stats.correct/store.stats.done):0}%</b><span class="muted">Bonnes réponses</span></div></div><div class="actions"><button class="btn" data-go="quiz">Commencer les exercices</button><button class="btn ghost" data-go="words">Voir le vocabulaire</button></div></div><div class="card"><div class="eyebrow">Situation réelle</div><div class="title">Au guichet administratif</div><p>Tu arrives pour une démarche. L'employée te dit :</p><div class="he" lang="he">חסר לך מסמך. את צריכה למלא טופס.</div><div class="phon">Khasser lakh mismakh. At tsrikha lemale tofess.</div><div class="actions">${btnSpeak('חסר לך מסמך. את צריכה למלא טופס.')}<button class="btn ghost" data-scenario="0">Comprendre la situation</button></div></div><div class="notice">La prononciation utilise la voix hébraïque de ton appareil, si elle est disponible. Elle peut varier selon le téléphone.</div>`}
function words(){let cats=['Tous',...new Set(WORDS.map(w=>w.cat))];let arr=WORDS.filter(w=>wordCategory==='Tous'||w.cat===wordCategory);return `<div class="card"><div class="eyebrow">Lexique de la vraie vie</div><div class="title">Mes mots utiles</div><select id="category" style="width:100%;padding:12px;border:1px solid #cad8cd;border-radius:12px;font-size:15px">${cats.map(c=>`<option ${c===wordCategory?'selected':''}>${safe(c)}</option>`).join('')}</select>${arr.map(w=>`<div class="word"><div class="he" lang="he">${w.he}</div><div class="phon">${w.ph}</div><b>${safe(w.fr)}</b><div style="margin-top:9px" dir="rtl" lang="he">${w.example}</div><div class="phon">${w.ep}</div><div class="muted">${safe(w.ef)}</div><div class="actions">${btnSpeak(w.he)}<button class="btn ghost" data-learn="${w.id}">${store.seen[w.id]?'✓ Étudié':'Marquer étudié'}</button></div></div>`).join('')}</div>`}
function randomQ(review=false){let pool=review?WORDS.filter(w=>store.missed[w.id]>0):WORDS;if(!pool.length)pool=WORDS.filter(w=>w.cat==='Verbes à revoir');let w=pool[Math.floor(Math.random()*pool.length)];let others=WORDS.filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3);let opts=[w,...others].sort(()=>Math.random()-.5);return {type:'word',w,opts,correct:opts.findIndex(x=>x.id===w.id),review}}
function scenarioQ(i){return {type:'scenario',s:SCENARIOS[i],correct:SCENARIOS[i].answer}}
function startQuiz(review=false){quiz=randomQ(review);selected=null;showAnswer=false;setTab(review?'review':'quiz')}
function answer(){if(!quiz)return `<div class="card"><div class="eyebrow">Entraînement actif</div><div class="title">Comprendre et retrouver les mots</div><p class="muted">Une question à la fois, correction après ta réponse. Les mots ratés reviennent en révision.</p><button class="btn" data-start="normal">Commencer</button><button class="btn ghost" data-scenario="0" style="margin-left:7px">Dialogue à la mairie</button></div>`;let q=quiz,opts=q.type==='word'?q.opts.map(x=>x.fr):q.s.options;let title=q.type==='word'?'Que signifie ce mot ?':q.s.name;let heb=q.type==='word'?q.w.he:q.s.he;let ph=q.type==='word'?q.w.ph:q.s.ph;return `<div class="card"><div class="eyebrow">${q.type==='word'?'Vocabulaire':'Situation réelle'}</div><div class="title">${title}</div>${q.type==='scenario'?`<p class="muted">${q.s.description}</p>`:''}<div class="he" lang="he">${heb}</div><div class="phon">${ph}</div><div class="actions">${btnSpeak(heb)}</div>${q.type==='scenario'?`<h3>${q.s.question}</h3>`:''}${opts.map((o,i)=>`<button class="choice ${selected===i?'selected':''} ${showAnswer&&selected===i&&i!==q.correct?'wrong':''}" data-choice="${i}" ${showAnswer?'disabled':''}>${safe(o)}</button>`).join('')}${showAnswer?`<div class="feedback ${selected===q.correct?'':'bad'}"><b>${selected===q.correct?'Bravo !':'À revoir'}</b><br>Bonne réponse : ${safe(opts[q.correct])}${q.type==='scenario'?`<br>${safe(q.s.explain)}`:''}</div><div class="actions"><button class="btn" data-next="1">Question suivante</button></div>`:`<div class="actions"><button class="btn" data-check="1" ${selected===null?'disabled':''}>Vérifier ma réponse</button></div>`}</div>`}
function review(){let missed=Object.entries(store.missed).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);return `<div class="card"><div class="eyebrow">Mémorisation durable</div><div class="title">Mes révisions prioritaires</div><p class="muted">Les mots manqués pendant les exercices apparaissent ici. Au départ, on révise aussi les verbes que tu as déjà trouvés difficiles.</p>${missed.length?missed.map(([id,n])=>{let w=WORDS.find(w=>w.id===id);return w?`<div class="word"><strong lang="he" dir="rtl">${w.he}</strong> <span class="pill">${n} erreur${n>1?'s':''}</span><div>${safe(w.fr)} · <i>${w.ph}</i></div></div>`:''}).join(''):'<div class="notice">Aucune erreur enregistrée pour le moment. Tu peux quand même réviser les verbes fragiles.</div>'}<div class="actions"><button class="btn" data-start="review">Faire une révision</button><button class="btn ghost" data-go="words">Relire les verbes</button></div></div>${quiz&&tab==='review'?answer():''}`}
function progress(){let n=store.stats.done,rate=n?Math.round(100*store.stats.correct/n):0;return `<div class="card"><div class="eyebrow">Tes progrès</div><div class="title">Tu avances à ton rythme</div><div class="grid"><div class="stat"><b>${n}</b><span class="muted">Questions répondues</span></div><div class="stat"><b>${rate}%</b><span class="muted">Réponses correctes</span></div><div class="stat"><b>${Object.keys(store.seen).length}</b><span class="muted">Mots étudiés</span></div><div class="stat"><b>${Object.values(store.missed).filter(n=>n>0).length}</b><span class="muted">Mots à revoir</span></div></div><p class="muted">Les résultats restent sur cet appareil et dans ce navigateur. Pour cette première version, il n'y a pas encore de compte ni de synchronisation.</p><button class="btn ghost" data-reset="1">Effacer mes progrès</button></div>`}
function render(){el.innerHTML=tab==='home'?home():tab==='words'?words():tab==='quiz'?answer():tab==='review'?review():progress()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return}if(b.dataset.go){setTab(b.dataset.go);return}if(b.dataset.speak){speak(b.dataset.speak);return}if(b.dataset.learn){store.seen[b.dataset.learn]=true;save();render();return}if(b.dataset.start){startQuiz(b.dataset.start==='review');return}if(b.dataset.scenario!==undefined){quiz=scenarioQ(Number(b.dataset.scenario));selected=null;showAnswer=false;setTab('quiz');return}if(b.dataset.choice!==undefined){selected=Number(b.dataset.choice);render();return}if(b.dataset.check){if(selected===null)return;showAnswer=true;store.stats.done++;let good=selected===quiz.correct;if(good)store.stats.correct++;if(quiz.type==='word'){store.seen[quiz.w.id]=true;store.missed[quiz.w.id]=Math.max(0,(store.missed[quiz.w.id]||0)+(good?-1:1))}save();render();return}if(b.dataset.next){startQuiz(quiz.review||false);return}if(b.dataset.reset){if(confirm('Effacer tous tes progrès enregistrés sur cet appareil ?')){store={seen:{},stats:{done:0,correct:0},missed:{}};save();render()}}});document.addEventListener('change',e=>{if(e.target.id==='category'){wordCategory=e.target.value;render()}});render();
</script></body></html>
