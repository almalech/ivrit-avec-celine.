"בנפרד, אם אפשר.","Séparément, si possible.",1],["בכרטיס, תודה רבה.","Par carte, merci beaucoup.",0],["עוד שתי דקות, בבקשה.","Encore deux minutes, s’il vous plaît.",-1]]},{"who":"Le serveur","he":"תרצי לשלם בכרטיס או במזומן?","fr":"Voulez-vous payer par carte ou en espèces ?","ph":"","opts":[["בכרטיס, תודה רבה.","Par carte, merci beaucoup.",1],["לא, יש שולחן פנוי לשתיים?","Non, avez-vous une table libre pour deux ?",0],["כן, מה יש בסלט הזה?","Oui, que contient cette salade ?",-1]]}]},{"name":"Réunion parents-profs","intro":"Discuter des progrès et du soutien scolaire","steps":[{"who":"La professeure","he":"שלום, רצית לדבר על הילד שלך?","fr":"Bonjour, vous vouliez parler de votre enfant ?","ph":"","opts":[["כן, חשוב לי להבין איך הוא מתקדם.","Oui, je veux comprendre ses progrès.",1],["הוא שמח, אבל לפעמים קשה לו.","Il est content, mais parfois c’est difficile.",0],["כן, זה יעזור לנו מאוד.","Oui, cela nous aiderait beaucoup.",-1]]},{"who":"La professeure","he":"איך הוא מרגיש בבית הספר?","fr":"Comment se sent-il à l’école ?","ph":"","opts":[["הוא שמח, אבל לפעמים קשה לו.","Il est content, mais parfois c’est difficile.",1],["כן, הוא מספר לי כמעט כל יום.","Oui, presque tous les jours.",0],["הוא מתחיל להכיר יותר חברים.","Il commence à se faire plus d’amis.",-1]]},{"who":"La professeure","he":"הוא מספר לך מה הוא לומד?","fr":"Vous raconte-t-il ce qu’il apprend ?","ph":"","opts":[["כן, הוא מספר לי כמעט כל יום.","Oui, presque tous les jours.",1],["נראה לי שהקריאה בעברית.","Je pense que c’est la lecture en hébreu.",0],["הוא מנסה, אבל לפעמים מתבייש.","Il essaie, mais parfois il est timide.",-1]]},{"who":"La professeure","he":"את יודעת מה הכי קשה לו?","fr":"Savez-vous ce qui lui est le plus difficile ?","ph":"","opts":[["נראה לי שהקריאה בעברית.","Je pense que c’est la lecture en hébreu.",1],["אני שמחה לשמוע את זה.","Je suis contente de l’entendre.",0],["לא תמיד, הוא חושש לטעות.","Pas toujours, il a peur de se tromper.",-1]]},{"who":"La professeure","he":"בקריאה הוא משתפר לאט לאט.", MISSIONS.push(...[{"name":"📱 WhatsApp · Groupe des parents","intro":"Messages de parents, horaires, autorisations et école","steps":[{"who":"Groupe des parents","he":"היי, מחר יש פעילות מיוחדת בכיתה. ראית את ההודעה?","fr":"Salut, demain il y a une activité spéciale en classe. Tu as vu le message ?","ph":"","opts":[["כן, ראיתי. באיזו שעה מתחילים?","Oui, à quelle heure commence-t-on ?",1],["ראיתי, אבל לא הבנתי איפה זה מתקיים.","Je l’ai vu mais je n’ai pas compris le lieu.",1],["כן, כבר שילמתי על הטיול.","Oui, j’ai déjà payé la sortie.",-1]]},{"who":"Groupe des parents","he":"מתחילים בשמונה וחצי, לא בשמונה.","fr":"On commence à 8 h 30, pas à 8 h.","ph":"","opts":[["תודה על העדכון, זה חשוב לי.","Merci pour la précision.",1],["אז צריך להגיע קצת יותר מאוחר?","Il faut donc arriver un peu plus tard ?",1],["אז אני אגיע בשבע וחצי.","J’arriverai donc à 7 h 30.",-1]]},{"who":"Groupe des parents","he":"הילדים צריכים להביא ארוחת בוקר ובקבוק מים.","fr":"Les enfants doivent apporter un petit-déjeuner et de l’eau.","ph":"","opts":[["צריך להביא גם כובע?","Faut-il aussi apporter une casquette ?",1],["הבנתי, אני אכין הכול הערב.","Compris, je préparerai tout ce soir.",1],["אז לא צריך להביא שום דבר?","Donc il ne faut rien apporter ?",-1]]},{"who":"Groupe des parents","he":"כן, גם כובע. הפעילות תהיה בחוץ.","fr":"Oui, une casquette aussi, l’activité sera dehors.","ph":"","opts":[["טוב לדעת, תודה שהזכרת לי.","Bon à savoir, merci de me le rappeler.",1],["אם ירד גשם, הפעילות תתקיים?","Et s’il pleut, l’activité aura lieu ?",1],["אז נשאיר את הכובע בבית.","Alors on laisse la casquette à la maison.",-1]]},{"who":"Groupe des parents","he":"אם ירד גשם, נישאר בתוך בית הספר.","fr":"S’il pleut, on restera dans l’école.","ph":"","opts":[["מצוין, אז לא מבטלים את הפעילות.","Parfait, l’activité n’est donc pas annulée.",1],["הבנתי, רק המקום ישתנה.","Compris, seul le lieu changera.",1],["אז הילדים יישארו בבית.","Alors les enfants resteront à la maison.",-1]]},{"who":"Groupe des parents","he":"יש גם טופס איש const VERBS=WORDS.filter(w=>w.he.startsWith('ל'));
function uniqueChoices(correct,other){return shuffle([correct,...other.filter(x=>x!==correct).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3)]).slice(0,4)}
function makeMystery(){
 const candidates=VERBS.filter(w=>w.female&&w.male&&w.female!==w.male);
 const w=pick(candidates);const form=pick(['female','male','past']);
 let phrase=form==='female'?'היא ___ עכשיו.':form==='male'?'הוא ___ עכשיו.':'אתמול אני ___.',answer=form==='female'?w.female:form==='male'?w.male:w.past;
 if(!answer)return makeMystery();
 let others=[w.he,w.female,w.male,w.past,...shuffle(candidates.filter(x=>x.id!==w.id)).map(x=>x[form])].filter(Boolean);
 let opts=uniqueChoices(answer,others);
 // For a blank with subject, alternatives of the same verb are always grammatically relevant.
 if(opts.length<4)return makeMystery();

}
function mysteryView(){if(!mystery)return `<div class="card"><div class="eyebrow">Nouveau jeu · Conjugaison</div><div class="title">🧩 Le verbe mystère</div><p class="muted">Complète les phrases en choisissant la bonne forme du verbe. Présent féminin, masculin et passé. Les réponses sont en hébreu.</p><button class="btn" data-mystery-start="1">Commencer</button></div>`;

function resetSurvival(){
 const all=shuffle(VERBS);survival={items:all,index:0,started:Date.now(),failed:false,finished:false,question:null};
 makeSurvivalQuestion();
 if(survivalTimer)clearInterval(survivalTimer);

}
function elapsedSurvival(){if(!survival)return '0:00';let sec=Math.floor(((survival.finishedAt||Date.now())-survival.started)/1000);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function makeSurvivalQuestion(){
 const w=survival.items[survival.index],reverse=survival.index%2===1;
 const bad=shuffle(VERBS.filter(x=>x.id!==w.id&&x.fr!==w.fr));
 const answer=reverse?w.fr:w.he;

 survival.question={w,reverse,answer,options};
}
function survivalView(){if(!survival)return `<div class="card"><div class="eyebrow">Nouveau jeu · Challenge</div><div class="title">🏆 Le défi zéro faute</div><p class="muted">${VERBS.length} verbes, mélangés et sans répétition. Un seul mauvais choix : partie perdue et retour au début. Le chronomètre mesure ta rapidité, sans limite de temps.</p><div class="grid"><div class="stat"><b>${store.survivalBest}</b><span class="muted">Record de suite</span></div><div class="stat"><b>${store.survivalBestTime===null?'—':safe(store.survivalBestTime)}</b><span class="muted">Meilleur temps complet</span></div></div><div class="actions"><button class="btn" data-survival-start="1">Lancer le défi</button></div></div>`;
 let t=survival,q=t.question;
 let head=`<div class="eyebrow">🏆 Zéro faute</div><div class="grid"><div class="stat"><b>${t.index} / ${t.items.length}</b><span class="muted">Bonnes réponses</span></div><div class="stat"><b id="survival-clock">${elapsedSurvival()}</b><span class="muted">Chronomètre</span></div></div><div class="progress" style="margin-top:12px"><div style="width:${100*t.index/t.items.length}%"></div></div>`;
 if(t.failed)return `<div class="card">${head}<div class="title">❌ Perdu !</div><p>Tu avais enchaîné <b>${t.index} bonne(s) réponse(s)</b>. Une erreur = retour à zéro.</p><div class="feedback bad"><div>Question : ${safe(q.reverse?q.w.he:q.w.fr)}</div><div>Bonne réponse : <b>${safe(q.answer)}</b></div></div><p class="muted">Record personnel : ${store.survivalBest} / ${VERBS.length}</p><button class="btn" data-survival-start="1">Recommencer depuis zéro</button></div>`;
 if(t.finished)return `<div class="card">${head}<div class="title">🌸 Sans-faute total !</div><p>Bravo ! ${VERBS.length} verbes sans une seule erreur en <b>${elapsedSurvival()}</b>.</p><p class="muted">Meilleur temps : ${safe(store.survivalBestTime)}</p><button class="btn" data-survival-start="1">Rejouer</button></div>`;
 return `<div class="card">${head}<p class="muted" style="margin-top:22px">${q.reverse?'Que veut dire ce verbe ?':'Traduis ce verbe en hébreu :'}</p>${q.reverse?`<div class="he">${safe(q.w.he)}</div>`:`<div class="title">${safe(q.w.fr)}</div>`}${q.options.map((o,i)=>`<button class="choice" data-survival-answer="${i}" ${q.reverse?'':'dir="rtl"'}>${safe(o)}</button>`).join('')}<p class="muted small">Une seule erreur et la série recommence. Record : ${store.survivalBest}.</p><button class="btn ghost" data-survival-exit="1">Quitter la partie</button></div>`;
}
function render(){el.innerHTML=tab==='mystery'?mysteryView():tab==='survival'?survivalView():tab==='roles'?rolesView():tab==='home'?home():tab==='situations'?situations():tab==='words'?words():tab==='quiz'?quizView():tab==='memory'?memoryView():tab==='review'?review():progress()}function record(w,good){store.stats.done++;if(good)store.stats.correct++;store.seen[w.id]=true;store.missed[w.id]=Math.max(0,(store.missed[w.id]||0)+(good?-1:1));store.levels[w.id]=Math.max(0,(store.levels[w.id]||0)+(good?1:-2));save()}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.tab){setTab(d.tab);return}if(d.go){setTab(d.go);return}if(d.speak){speak(d.speak);return}if(d.learn){store.seen[d.learn]=true;save();render();return}if(d.known){store.known[d.known]=!store.known[d.known];store.seen[d.known]=true;save();render();return}if(d.mysteryStart||d.mysteryNext){makeMystery();setTab('mystery');return}
if(d.mysteryPick!==undefined){if(!mystery||mystery.done)return;mystery.chosen=Number(d.mysteryPick);mystery.done=true;record(mystery.w,mystery.opts[mystery.chosen]===mystery.answer);render();return}
if(d.survivalStart){resetSurvival();setTab('survival');return}

(function(){

const normalize=(w)=>store.learning[w.id]??{status:'new',good:0,bad:0,streak:0,due:0};
const candidates=(selectedMode)=>WORDS.filter(w=>w.he&&w.fr&&(selectedMode==='verbs'?w.he.startsWith('ל'):selectedMode==='hard'?(normalize(w).status==='hard'||normalize(w).status==='review'):selectedMode==='new'?normalize(w).status==='new':true));

 if(!choices.length){currentId=null;return}
 let filtered=choices.filter(w=>!previous.includes(w.id));if(filtered.length)choices=filtered;
 const now=Date.now();
 // Unknown words and those due to be reviewed are sampled more often, but NEVER shown immediately twice when there are alternatives.
 const ranked=choices.map(w=>{const a=normalize(w);return {w,weight:a.status==='hard'?7:a.status==='review'?(a.due<=now?5:2):a.status==='new'?4:a.due<=now?3:1}});
